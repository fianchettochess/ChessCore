name: CI

# Build + test ChessCore on macOS (self-hosted Intel Mac Pro) and Linux
# (GitHub-hosted ubuntu-latest).  The full perft oracle runs under the
# release configuration on Linux.
#
# GATED OFF — auto-triggers are commented out below.  Nothing runs on
# push or pull_request until you opt in.  To run immediately:
#   GitHub → Actions → CI → "Run workflow"
#
# To enable on-branch CI uncomment the push / pull_request block below.

on:
  workflow_dispatch:
  # Uncomment to enable on-branch CI:
  # push:
  #   branches: [main]
  # pull_request:

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos-self-hosted:
    name: macOS — self-hosted (Intel Mac Pro)
    # Runs on the owner's Intel Mac Pro registered as a self-hosted runner.
    # x86_64 host — ChessCore is pure Swift so there are no arch-specific
    # build flags; universal-binary concerns are only relevant to the
    # downstream Fianchetto app build, not this package.
    runs-on: [self-hosted, macOS]
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: swift build
      - name: Test
        run: swift test

  linux:
    name: Linux (ubuntu-latest)
    runs-on: ubuntu-latest
    container: swift:latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: swift build
      - name: Test
        run: swift test

  perft:
    name: Perft oracle (release, Linux)
    runs-on: ubuntu-latest
    container: swift:latest
    steps:
      - uses: actions/checkout@v4
      # Deep perft depths are node-budget-gated in debug builds for fast local
      # iteration; the release configuration runs the full exact-node-count oracle.
      - name: Perft (release)
        run: swift test -c release --filter MoveGeneratorTests
