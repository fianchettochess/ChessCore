name: ChessCore — CI (manual full matrix)

# Build + test ChessCore on macOS (self-hosted Intel Mac Pro) and Linux
# (GitHub-hosted ubuntu-latest).  The full perft oracle runs under the
# release configuration on Linux.
#
# MANUAL-ONLY because this workflow includes a persistent self-hosted runner.
# Public pull requests and routine pushes run in ci-linux.yml on ephemeral
# GitHub-hosted runners. To run the trusted macOS + Linux matrix:
#   GitHub → Actions → CI → "Run workflow"

on:
  workflow_dispatch:

permissions:
  contents: read

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos-self-hosted:
    name: ChessCore — tests (macOS, Intel self-hosted)
    # SECURITY: Before public visibility, restrict the organization runner
    # group to fianchettochess/ChessCore/.github/workflows/ci.yml@refs/heads/main.
    # These generic labels route jobs; they are not an authorization boundary.
    # Runs on the owner's Intel Mac Pro registered as a self-hosted runner.
    # x86_64 host — ChessCore is pure Swift so there are no arch-specific
    # build flags; universal-binary concerns are only relevant to the
    # downstream Fianchetto app build, not this package.
    runs-on: [self-hosted, macOS]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The trusted runner owns its workspace; avoid copying its account's
          # global .gitconfig into the Actions log for safe-directory setup.
          set-safe-directory: false
          persist-credentials: false
      - name: Build
        run: swift build
      - name: Test
        run: swift test

  linux:
    name: ChessCore — tests (Linux, Swift ${{ matrix.swift }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        swift: ['6.0', 'latest']
    container: swift:${{ matrix.swift }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build
        run: swift build
      - name: Test
        run: swift test

  complete-release-suite:
    name: ChessCore — complete release suite (Linux, Swift 6.0)
    runs-on: ubuntu-latest
    container: swift:6.0
    timeout-minutes: 30
    env:
      RUN_BENCH: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build and run every test
        run: swift test -c release
