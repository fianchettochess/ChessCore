name: ChessCore — CI (Linux push gate)

# Routine on-push gate on the free GitHub-hosted Linux runner, so every commit
# gets fast feedback without touching the shared self-hosted Mac Pro. ChessCore
# is pure, cross-platform Swift. The full macOS + Linux matrix stays in ci.yml
# (workflow_dispatch), which this complements for routine pushes.

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-linux-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: ChessCore — tests (Linux, Swift ${{ matrix.swift }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        swift: ['6.0', 'latest']
    container: swift:${{ matrix.swift }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build
        run: swift build
      - name: Test
        run: swift test

  complete-release-suite:
    name: ChessCore — complete release suite (Linux, Swift 6.0)
    runs-on: ubuntu-latest
    container: swift:6.0
    timeout-minutes: 30
    env:
      # Opt the performance regression test into this release-configuration
      # gate so no test in the package reports as skipped.
      RUN_BENCH: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build and run every test
        run: swift test -c release
