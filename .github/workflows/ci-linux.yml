name: CI (Linux — push gate)

# Routine on-push gate on the free GitHub-hosted Linux runner, so every commit
# gets fast feedback without touching the shared self-hosted Mac Pro. ChessCore
# is pure, cross-platform Swift. The full macOS + Linux matrix stays in ci.yml
# (workflow_dispatch), which this complements for routine pushes.

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-linux-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux — Swift ${{ matrix.swift }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        swift: ['6.0', 'latest']
    container: swift:${{ matrix.swift }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build
        run: swift build
      - name: Test
        run: swift test
