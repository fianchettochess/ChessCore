name: ChessCore — Release
run-name: ChessCore release · ${{ github.event.inputs.version || github.ref_name }}

# Auto-publish a GitHub Release when a version tag (N.N.N) is pushed.
#
# ChessCore is a PURE-SWIFT source package — there is NO binary artifact to
# build or attach, unlike the SwiftStockfish / SwiftReckless release workflows
# (which compile an xcframework, upload it as the release asset, and rewrite
# Package.swift to url:+checksum:). So this workflow simply promotes the pushed
# tag to a GitHub Release with auto-generated notes. It never mutates `main` or
# the tag; consumers resolve the source at the tag as-is.
#
# TRIGGERS: pushing a tag like `0.6.2` is the primary path. Manual
# workflow_dispatch (with a `version` input naming an EXISTING tag) re-runs it
# if a Release needs to be (re)created for a tag that is already pushed.
#
# Before publishing, the workflow checks out the exact tag and runs the full
# release test suite (including every depth in the perft oracle) on the minimum
# supported Swift version. The publish job never checks out or executes package
# code with its write token.

on:
  push:
    tags:
      - '*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Existing tag to (re)publish as a Release (e.g. 0.6.2)'
        required: true
        type: string

defaults:
  run:
    shell: bash

jobs:
  verify:
    name: ChessCore — verify release tag
    runs-on: ubuntu-latest
    container: swift:6.0
    permissions:
      contents: read
    timeout-minutes: 30
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      commit: ${{ steps.metadata.outputs.commit }}
    steps:
      - name: Checkout exact tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.version || github.ref_name }}
          fetch-depth: 0

      # The Swift container runs as a different user than the host checkout
      # process. Trust only this exact, ephemeral Actions workspace so Git can
      # validate the checked-out tag without weakening ownership checks more
      # broadly.
      - name: Trust checked-out workspace
        run: git config --global --add safe.directory "${GITHUB_WORKSPACE}"

      - name: Validate tag and checkout
        id: metadata
        env:
          VERSION: ${{ github.event.inputs.version || github.ref_name }}
        run: |
          set -euo pipefail
          if [[ ! "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "invalid release version: $VERSION (expected N.N.N without leading zeros)" >&2
            exit 1
          fi
          if ! git show-ref --verify --quiet "refs/tags/$VERSION"; then
            echo "release version is not an existing tag: $VERSION" >&2
            exit 1
          fi
          tag_commit="$(git rev-list -n 1 "refs/tags/$VERSION")"
          checkout_commit="$(git rev-parse HEAD)"
          if [[ "$checkout_commit" != "$tag_commit" ]]; then
            echo "checkout $checkout_commit does not match tag $VERSION ($tag_commit)" >&2
            exit 1
          fi
          printf 'version=%s\n' "$VERSION" >> "$GITHUB_OUTPUT"
          printf 'commit=%s\n' "$tag_commit" >> "$GITHUB_OUTPUT"

      - name: Build release configuration
        run: swift build -c release

      - name: Test release configuration and full perft oracle
        env:
          RUN_BENCH: '1'
        run: swift test -c release

  release:
    name: ChessCore — publish GitHub release
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 10
    steps:
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.verify.outputs.version }}
          EXPECTED_SHA: ${{ needs.verify.outputs.commit }}
        run: |
          set -euo pipefail
          current_sha="$(gh api "repos/$GH_REPO/commits/$VERSION" --jq '.sha')"
          if [[ "$current_sha" != "$EXPECTED_SHA" ]]; then
            echo "tag $VERSION moved after verification ($EXPECTED_SHA -> $current_sha)" >&2
            exit 1
          fi
          if gh release view "$VERSION" --repo "$GH_REPO" >/dev/null 2>&1; then
            echo "release $VERSION already exists — nothing to do"
            exit 0
          fi
          gh release create "$VERSION" \
            --repo "$GH_REPO" \
            --title "ChessCore $VERSION" \
            --verify-tag \
            --generate-notes
